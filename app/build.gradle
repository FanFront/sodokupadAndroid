plugins {
    id 'com.android.application'
}

// PUBLIC TEST KEY ONLY. This is intentionally checked into the repository,
// so Android debug APKs built on different runners use the same certificate.
// Anyone can sign APKs with this key: never use it for a trusted production app.
def bundledSigningFile = file('signing/sudokuvania-debug.p12.base64')
if (!bundledSigningFile.isFile()) {
    throw new GradleException('Repository-bundled debug signing key is missing')
}
def signingBytes
try {
    signingBytes = java.util.Base64.getMimeDecoder().decode(bundledSigningFile.getText('UTF-8'))
} catch (IllegalArgumentException error) {
    throw new GradleException('Invalid repository-bundled debug signing key', error)
}
def expectedKeySha256 = 'a53b760e2e0759e1e6792aa923410349229ef4368b4effbdc0036fca01860d9a'
def actualKeySha256 = java.security.MessageDigest.getInstance('SHA-256')
        .digest(signingBytes).encodeHex().toString()
if (actualKeySha256 != expectedKeySha256) {
    throw new GradleException('Bundled debug key fingerprint changed; existing Android installs would become incompatible')
}
def stableKeystore = layout.buildDirectory.file('signing/sudokuvania-debug.p12').get().asFile
stableKeystore.parentFile.mkdirs()
if (!stableKeystore.isFile() || !java.util.Arrays.equals(stableKeystore.bytes, signingBytes)) {
    stableKeystore.bytes = signingBytes
}
def stableSigningPassword = 'SudokuvaniaPublicTest2026'

// GitHub Actions run_number is increasing across normal and manual builds of
// this workflow. A new workflow run therefore produces an upgradeable APK.
def buildNumberText = System.getenv('SUDOKUVANIA_VERSION_CODE') ?:
        System.getenv('GITHUB_RUN_NUMBER') ?: '1'
if (!(buildNumberText ==~ /[0-9]+/)) {
    throw new GradleException('SUDOKUVANIA_VERSION_CODE must be a positive integer')
}
def buildNumber = Integer.parseInt(buildNumberText)
if (buildNumber <= 0 || buildNumber > 2000000000) {
    throw new GradleException('Invalid version code: ' + buildNumber)
}

android {
    namespace 'com.fanfront.sodokupadandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fanfront.sodokupadandroid'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "0.2.${buildNumber}"
    }

    signingConfigs {
        stableTest {
            storeFile stableKeystore
            storePassword stableSigningPassword
            keyAlias 'sudokuvania'
            keyPassword stableSigningPassword
            storeType 'pkcs12'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableTest
        }
        release {
            // Personal offline testing only; the bundled key is PUBLIC.
            signingConfig signingConfigs.stableTest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
