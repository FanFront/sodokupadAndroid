name: Build offline APK

# Downloading third-party files is opt-in, for personal testing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: offline-port-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and Simplified Chinese packs
        env:
          SUDOKU_ALLOW_PENDING_CAPTURE: ${{ contains(github.event.head_commit.message, '[capture-super-sudokoid]') }}
        run: |
          python3 scripts/check-assets.py
          node --check app/src/main/assets/translate.js
          node --check scripts/capture-offline.mjs
          node --check scripts/capture-super-sudokoid.mjs
          node --check scripts/capture-super-sudokoid-linked.mjs
          node --check scripts/replay-super-sudokoid-linked.mjs
          node --check scripts/verify-offline.mjs
          node --check scripts/replay-offline.mjs
          node --check scripts/test-android-touch.mjs
          node --check scripts/extract-text.mjs
          node --check scripts/build-localized-pages.mjs
          node --check scripts/decode-scl.mjs
          node --check scripts/build-translated-puzzles.mjs
          node --check scripts/build-translated-bosses.mjs
          node --check scripts/test-boss-localization.mjs
          node --check scripts/test-scl.mjs
          node --check app/src/main/assets/offline/mobile/android.js
          node --check scripts/apply-translations.mjs
          node scripts/test-translation.cjs
          npm install --no-audit --no-fund
          node scripts/test-scl.mjs
          bash -n scripts/verify-signed-apk.sh
          node scripts/test-stable-signing.mjs

  build-cached-apk:
    # The repository carries a PUBLIC testing certificate; no Secrets needed.
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[capture-super-sudokoid]') && !contains(github.event.head_commit.message, '[capture-super-linked]')) || github.event_name == 'pull_request'
    needs: source-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild the Chinese pages from existing offline assets
        run: |
          npm install --no-audit --no-fund
          npm run apply-translations
          npm run build-html
          npm run build-puzzle-zh
          npm run build-boss-zh
          npm run verify
          npm run test-boss-zh
          node scripts/test-scl.mjs --require-translated
      - name: Test the actual rendered board at Android phone size
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-android-touch.mjs
          node scripts/replay-offline.mjs
          node scripts/replay-super-sudokoid-linked.mjs
      - name: Upload replay diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-debug-phone-replay
          path: offline-debug/
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble with repository-bundled fixed test key and increasing versionCode
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify bundled certificate, package name and upgrade version
        run: bash scripts/verify-signed-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-stable-signed-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-info.txt
          if-no-files-found: error
          retention-days: 14


  capture-super-sudokoid:
    # Explicit one-off capture of the two requested main puzzles. Preserve
    # the 100+ Sudokuvania pages and all existing boss resources.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-super-sudokoid]')
    needs: source-checks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture Super Sudokoid 1/2 main puzzle pages and SCL
        run: node scripts/capture-super-sudokoid.mjs
      - name: Build Chinese pages and preserved main puzzle packages
        run: |
          npm run apply-translations
          npm run build-html
          npm run build-puzzle-zh
          npm run build-boss-zh
          npm run verify
          node scripts/test-scl.mjs --require-translated
          npm run extract-strings
      - name: Commit newly captured offline resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/assets/offline/
          if ! git diff --cached --quiet; then
            git commit -m "chore: bundle Super Sudokoid 1/2 main puzzles [offline snapshot]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi


  capture-super-linked:
    # Incremental, explicit archive of the Super Sudokoid side/boss puzzles.
    # Preserve every already captured Sudokuvania and main-map resource.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-super-linked]')
    needs: source-checks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser capture dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture all authored bonus and boss puzzles
        run: node scripts/capture-super-sudokoid-linked.mjs
      - name: Rebuild Android HTML and verify linked SCL
        run: |
          npm run build-html
          npm run build-puzzle-zh
          npm run build-boss-zh
          OFFLINE_REQUIRE_SUPER_LINKED=1 npm run verify
          npm run test-boss-zh
          node scripts/test-scl.mjs --require-translated
      - name: Replay every linked puzzle with network disabled
        run: |
          node scripts/test-android-touch.mjs
          node scripts/replay-super-sudokoid-linked.mjs
          node scripts/replay-offline.mjs
      - name: Upload linked capture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Super-Sudokoid-linked-diagnostics
          path: |
            offline-debug/
            app/src/main/assets/offline/super-sudokoid-linked-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Save complete linked offline bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/assets/offline/
          if ! git diff --cached --quiet; then
            git commit -m "chore: bundle Super Sudokoid side and boss puzzles [offline snapshot]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  personal-offline-apk:
    # A one-time explicit capture can also be requested by a commit marker.
    # Capturing the generated snapshot never recursively starts another capture.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-bosses]'))
    permissions:
      contents: write
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install browser snapshot tool
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify real Android touch input in a browser
        run: node scripts/test-android-touch.mjs
      - name: Capture SudokuPad pages, JS, CSS, assets and game data
        run: npm run capture
      - name: Restore every Super Sudokoid linked puzzle to the full snapshot
        run: node scripts/capture-super-sudokoid-linked.mjs
      - name: Synchronize reviewed translation catalog into game dictionaries
        run: npm run apply-translations
      - name: Materialize readable HTML and apply reviewed Chinese translations
        run: npm run build-html
      - name: Bake reviewed Chinese into offline compressed game metadata
        run: npm run build-puzzle-zh
      - name: Localize imported boss puzzles without touching solutions
        run: npm run build-boss-zh
      - name: Validate every boss puzzle and its Android controls
        run: OFFLINE_REQUIRE_BOSS_PUZZLES=1 npm run verify
      - name: Verify Chinese boss narratives and puzzle integrity
        run: npm run test-boss-zh
      - name: Validate SudokuPad-compatible puzzle encoding
        run: node scripts/test-scl.mjs --require-translated
      - name: Extract English text from HTML and puzzle data
        run: npm run extract-strings
      - name: Save captured resources and HTML into GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/assets/offline/
          if ! git diff --cached --quiet; then
            git commit -m "chore: save offline HTML and assets [offline snapshot]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Build with repository-bundled fixed test key
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify bundled certificate, package name and upgrade version
        run: bash scripts/verify-signed-apk.sh
      - name: Replay all four main games and Super Sudokoid side puzzles offline
        run: |
          node scripts/replay-offline.mjs
          node scripts/replay-super-sudokoid-linked.mjs
      - name: Upload replay diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-debug-manual-replay
          path: offline-debug/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload permanently signed personal test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-stable-signed-personal-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/signing-info.txt
          if-no-files-found: error
          retention-days: 7
