name: Build offline APK

# Downloading third-party files is opt-in, for personal testing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: offline-port-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and Simplified Chinese packs
        run: |
          python3 scripts/check-assets.py
          node --check app/src/main/assets/translate.js
          node --check scripts/capture-offline.mjs
          node --check scripts/verify-offline.mjs
          node --check scripts/replay-offline.mjs
          node --check scripts/extract-text.mjs
          node --check scripts/build-localized-pages.mjs
          node --check scripts/decode-scl.mjs
          node --check scripts/build-translated-puzzles.mjs
          node --check app/src/main/assets/offline/mobile/android.js
          node --check scripts/apply-translations.mjs
          node scripts/test-translation.cjs

  build-cached-apk:
    if: github.event_name == 'push'
    needs: source-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild the Chinese pages from existing offline assets
        run: |
          npm install --no-audit --no-fund
          npm run build-html
          npm run build-puzzle-zh
          npm run verify
      - name: Assemble cached offline debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-android-touch-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  personal-offline-apk:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install browser snapshot tool
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture SudokuPad pages, JS, CSS, assets and game data
        run: npm run capture
      - name: Materialize readable HTML and apply reviewed Chinese translations
        run: npm run build-html
      - name: Bake reviewed Chinese into offline compressed game metadata
        run: npm run build-puzzle-zh
      - name: Validate the local capture before packaging
        run: npm run verify
      - name: Extract English text from HTML and puzzle data
        run: npm run extract-strings
      - name: Save captured resources and HTML into GitHub repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/assets/offline/
          if ! git diff --cached --quiet; then
            git commit -m "chore: save offline HTML and assets [offline snapshot]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Build offline debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Replay both games with all network requests blocked
        run: node scripts/replay-offline.mjs
      - name: Upload personal offline test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-offline-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
