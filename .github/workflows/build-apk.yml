name: Build offline APK

# Downloading third-party files is opt-in, for personal testing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source and Simplified Chinese packs
        run: |
          python3 scripts/check-assets.py
          node --check app/src/main/assets/translate.js
          node --check scripts/capture-offline.mjs
          node --check scripts/verify-offline.mjs
          node --check scripts/replay-offline.mjs
          node --check scripts/extract-text.mjs
          node scripts/test-translation.cjs

  personal-offline-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: source-checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install browser snapshot tool
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture SudokuPad pages, JS, CSS, assets and game data
        run: npm run capture
      - name: Validate the local capture before packaging
        run: npm run verify
      - name: Replay both games with all network requests blocked
        run: node scripts/replay-offline.mjs
      - name: Extract translation candidates privately
        run: npm run extract-strings
      - name: Build offline debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload personal offline test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudokuvania-offline-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
